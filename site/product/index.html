<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Platform Prism</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root {
  --bg: #f2f4f4; --surface: #ffffff; --raised: #f7f9f9; --fg: #132022; --muted: #57686b; --line: #d4dcdc;
  --accent: #0b6f78; --accent-soft: #d8eef0; --ok: #1b7a45; --ok-soft: #dcf1e4; --bad: #b0301f; --bad-soft: #f8e0dc;
  --warn: #8a5b00; --warn-soft: #f7ecd2; --node: #e8eef0;
  --display: "Space Grotesk", "Segoe UI", system-ui, sans-serif;
  --body: "Inter", system-ui, -apple-system, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0e1415; --surface: #152022; --raised: #1a2729; --fg: #e5eeee; --muted: #93a7a9; --line: #2a3a3d;
  --accent: #5cc9d2; --accent-soft: #163a3e; --ok: #6fd39d; --ok-soft: #173326; --bad: #ff8f80; --bad-soft: #3d1f1b;
  --warn: #f0c060; --warn-soft: #3a2f14; --node: #1f2e31; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0e1415; --surface: #152022; --raised: #1a2729; --fg: #e5eeee; --muted: #93a7a9; --line: #2a3a3d;
  --accent: #5cc9d2; --accent-soft: #163a3e; --ok: #6fd39d; --ok-soft: #173326; --bad: #ff8f80; --bad-soft: #3d1f1b;
  --warn: #f0c060; --warn-soft: #3a2f14; --node: #1f2e31; color-scheme: dark }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.6 var(--body); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.wrap { max-width: 72rem; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 4rem; }
h1, h2, h3 { font-family: var(--display); text-wrap: balance; margin: 0; }
h1 { font-size: clamp(2rem, 5vw, 3.2rem); line-height: 1.05; letter-spacing: -.015em; }
h2 { font-size: clamp(1.4rem, 3vw, 2rem); line-height: 1.15; margin-bottom: .4rem; }
h3 { font-size: 1.1rem; font-weight: 500; }
p { margin: .4rem 0; }
code, .mono { font-family: var(--mono); font-size: .86em; overflow-wrap: anywhere; }
.muted { color: var(--muted); }
.eyebrow { font: 600 .74rem var(--body); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.spectrum { height: 3px; border-radius: 2px; background: linear-gradient(90deg, #e5484d, #f5a524, #46a758, #12a5b5, #3e63dd, #8e4ec6); }

/* Top bar: brand, the live seal, the site switch, the views. */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 6; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.top .wrap { padding-block: 0; }
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: .6rem 1rem; padding-block: .7rem; }
.brand { font: 700 1.05rem var(--display); display: flex; align-items: center; gap: .5rem; margin-right: auto; }
.brand i { width: 14px; height: 14px; border-radius: 50%; background: conic-gradient(#e5484d, #f5a524, #46a758, #12a5b5, #3e63dd, #8e4ec6, #e5484d); }
.seal { display: flex; align-items: center; gap: .45rem; font-size: .8rem; padding: .25rem .65rem; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; }
.seal b { font-weight: 600; }
.seal .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--warn); }
.seal[data-state="ok"] .dot { background: var(--ok); box-shadow: 0 0 0 3px var(--ok-soft); }
.seal[data-state="bad"] .dot { background: var(--bad); }
.switch { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; font-size: .8rem; background: var(--surface); }
.switch button { border: 0; background: none; color: var(--muted); padding: .25rem .7rem; font: inherit; cursor: pointer; }
.switch button[aria-pressed="true"] { background: var(--accent); color: var(--bg); }
nav.views { display: flex; gap: .35rem; overflow-x: auto; padding-bottom: .6rem; scrollbar-width: thin; }
nav.views a { flex: none; text-decoration: none; color: var(--fg); border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: .3rem .7rem; font-size: .86rem; font-weight: 600; display: flex; flex-direction: column; line-height: 1.25; }
nav.views a small { font: 500 .62rem var(--body); letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
nav.views a[aria-current="true"] { border-color: var(--accent); box-shadow: inset 0 -2px 0 var(--accent); }

section.view { padding-top: 2rem; }
section.view[hidden] { display: none !important; }
@media (prefers-reduced-motion: no-preference) { section.view { animation: rise .3s ease-out; } @keyframes rise { from { opacity: .4; transform: translateY(6px); } } }
.grid { display: grid; gap: 1rem; }
.g2 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 22rem), 1fr)); }
.g3 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 16rem), 1fr)); }
.grid > * { min-width: 0; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 1.1rem 1.2rem; }
.card.flat { background: var(--raised); }
.lede { max-width: 46rem; font-size: 1.05rem; color: var(--muted); }

/* Hero */
.hero { padding-block: 2.5rem 1rem; display: grid; gap: 1.5rem; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); align-items: center; }
@media (max-width: 820px) { .hero { grid-template-columns: 1fr; } }
.hero .tag { font: 500 1.2rem/1.4 var(--display); color: var(--accent); margin: .8rem 0 .4rem; }
.stats { display: flex; flex-wrap: wrap; gap: .4rem 1.4rem; margin-top: 1rem; font-variant-numeric: tabular-nums; }
.stats b { font: 700 1.5rem var(--display); margin-right: .3rem; }

/* The replay matrix: one cell per acceptance vector. */
.matrix { display: grid; grid-template-columns: repeat(auto-fill, minmax(18px, 1fr)); gap: 4px; margin-top: .7rem; }
.matrix span { aspect-ratio: 1; border-radius: 4px; background: var(--node); transition: background .2s, transform .2s; }
.matrix span.ok { background: var(--ok); }
.matrix span.bad { background: var(--bad); }
.matrix span.run { transform: scale(1.25); background: var(--accent); }

/* Workbench: one decision app with real controls. */
.bench header { display: flex; flex-wrap: wrap; justify-content: space-between; gap: .3rem 1rem; align-items: baseline; }
.pat { font: .72rem var(--mono); color: var(--muted); }
.fields { display: grid; gap: .7rem; margin: .9rem 0; }
.field label { display: block; font-size: .8rem; color: var(--muted); margin-bottom: .25rem; }
.seg { display: flex; flex-wrap: wrap; gap: .3rem; }
.seg button { border: 1px solid var(--line); background: var(--raised); color: var(--fg); border-radius: 7px; padding: .25rem .6rem; font: .82rem var(--mono); cursor: pointer; }
.seg button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--fg); font-weight: 600; }
.seg button:focus-visible, .switch button:focus-visible, nav.views a:focus-visible, .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { display: flex; align-items: center; gap: .6rem; }
.num input[type=range] { flex: 1; accent-color: var(--accent); min-width: 0; }
.num output { font: 600 .9rem var(--mono); min-width: 3ch; text-align: right; }
.answer { display: flex; align-items: center; gap: .8rem; padding: .8rem 1rem; border-radius: 10px; background: var(--raised); border: 1px solid var(--line); }
.answer .word { font: 700 1.5rem var(--display); }
.answer[data-tone="ok"] { background: var(--ok-soft); border-color: transparent; } .answer[data-tone="ok"] .word { color: var(--ok); }
.answer[data-tone="bad"] { background: var(--bad-soft); border-color: transparent; } .answer[data-tone="bad"] .word { color: var(--bad); }
.answer[data-tone="warn"] { background: var(--warn-soft); border-color: transparent; } .answer[data-tone="warn"] .word { color: var(--warn); }
@media (prefers-reduced-motion: no-preference) { .answer.pulse { animation: pulse .35s ease-out; } @keyframes pulse { from { transform: scale(.98); } } }
.answer small { display: block; color: var(--muted); font-size: .84rem; line-height: 1.4; }
.req { font: .78rem var(--mono); color: var(--muted); margin-top: .4rem; }
.trace { margin-top: .7rem; font-size: .88rem; border-left: 3px solid var(--accent); padding-left: .7rem; }
.promises { list-style: none; padding: 0; margin: .7rem 0 0; display: grid; gap: .35rem; font-size: .86rem; }
.promises li { display: flex; gap: .5rem; align-items: baseline; padding: .3rem .5rem; border-radius: 7px; }
.promises li.live { background: var(--accent-soft); }
.promises .k { font: 600 .66rem var(--mono); text-transform: uppercase; padding: .05rem .35rem; border-radius: 4px; flex: none; }
.k.never { color: var(--bad); border: 1px solid var(--bad); } .k.always { color: var(--ok); border: 1px solid var(--ok); }
.served { font: .68rem var(--mono); color: var(--muted); border: 1px dashed var(--line); border-radius: 5px; padding: .05rem .35rem; }
.btn { border: 1px solid var(--accent); background: var(--accent); color: var(--bg); border-radius: 8px; padding: .4rem .85rem; font: 600 .86rem var(--body); cursor: pointer; }
.btn.ghost { background: transparent; color: var(--accent); }

/* Journey */
.journey { list-style: none; padding: 0; margin: 0; display: grid; gap: .6rem; counter-reset: j; }
.journey li { counter-increment: j; display: grid; grid-template-columns: 2.2rem minmax(0, 1fr) auto; gap: .2rem .7rem; align-items: center; padding: .6rem .7rem; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); }
.journey li::before { content: counter(j); font: 700 1rem var(--display); color: var(--accent); width: 2rem; height: 2rem; border-radius: 50%; display: grid; place-items: center; background: var(--accent-soft); }
.journey .says { font-weight: 600; }
.journey .got { font: 600 .85rem var(--mono); }

/* Diagrams */
svg { max-width: 100%; height: auto; display: block; }
.diagram text { font-family: var(--body); fill: var(--fg); }
.sm-node rect { fill: var(--node); stroke: var(--line); stroke-width: 1.5; transition: fill .3s, stroke .3s; }
.sm-node.final rect { stroke-width: 3; }
.sm-node.on rect { fill: var(--accent-soft); stroke: var(--accent); }
.sm-edge { stroke: var(--line); stroke-width: 1.5; fill: none; }
.sm-edge.fired { stroke: var(--accent); stroke-width: 3; }
.flow line, .flow path { stroke: var(--line); stroke-width: 1.5; fill: none; }
.flow .hot { stroke: var(--accent); stroke-width: 2.5; }
.flow rect { fill: var(--surface); stroke: var(--line); }
.flow .hotbox { stroke: var(--accent); stroke-width: 2; }
.dz { border: 2px dashed var(--line); border-radius: 12px; padding: 1.2rem; text-align: center; background: var(--raised); transition: border-color .2s; }
.dz.over { border-color: var(--accent); }
textarea { width: 100%; min-height: 4.5rem; font: .86rem var(--mono); background: var(--surface); color: var(--fg); border: 1px solid var(--line); border-radius: 8px; padding: .6rem; }
.addr { font: .82rem var(--mono); word-break: break-all; padding: .5rem .7rem; border-radius: 8px; background: var(--raised); border: 1px solid var(--line); margin: .3rem 0; }
.addr b { color: var(--accent); }
.bytes { display: flex; flex-wrap: wrap; gap: 3px; margin: .5rem 0; }
.bytes span { font: .7rem var(--mono); padding: .1rem .25rem; border-radius: 3px; background: var(--node); cursor: pointer; }
.bytes span.flip { background: var(--bad); color: var(--bg); }
table.t { border-collapse: collapse; width: 100%; font-size: .86rem; }
.tw { overflow-x: auto; }
table.t th, table.t td { text-align: left; padding: .4rem .5rem; border-bottom: 1px solid var(--line); vertical-align: top; }
.pill { font: 600 .72rem var(--mono); padding: .05rem .45rem; border-radius: 999px; background: var(--node); }
.pill.ok { background: var(--ok-soft); color: var(--ok); } .pill.bad { background: var(--bad-soft); color: var(--bad); } .pill.warn { background: var(--warn-soft); color: var(--warn); }
.big { font: 700 clamp(2.4rem, 8vw, 4.5rem)/1 var(--display); letter-spacing: -.02em; }
.lex { display: grid; gap: .5rem; }
.lex div { padding: .55rem .7rem; border-radius: 8px; background: var(--raised); border: 1px solid var(--line); }
footer { margin-top: 3rem; padding-top: 1rem; border-top: 1px solid var(--line); color: var(--muted); font-size: .85rem; }
a { color: var(--accent); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
</style>

<div class="top">
  <div class="wrap">
    <div class="bar">
      <div class="brand"><i aria-hidden="true"></i><span id="brand"></span></div>
      <button class="seal" id="seal" data-state="wait" title="Replay every acceptance vector again"><span class="dot"></span><span id="seal-text">Opening the holo…</span></button>
      <div class="switch" role="group" aria-label="Where this page runs" id="site"></div>
    </div>
    <nav class="views" id="nav" aria-label="Views"></nav>
  </div>
</div>
<main class="wrap" id="main"></main>
<div class="wrap"><footer id="foot"></footer></div>

mits the blob"},{"when":[{"field":"event","op":"is","value":"complete"},{"field":"label","op":"is","value":"mismatch"}],"then":"rejected","why":"12.12: a kappa-label mismatch on complete is rejected with 409"}],"otherwise":"open","otherwiseWhy":"a session that received nothing it acts on stays open","properties":[{"kind":"never","when":[{"field":"label","op":"is","value":"mismatch"},{"field":"state","op":"is not","value":"committed"}],"then":"committed","why":"content that does not match its label is never committed"},{"kind":"always","when":[{"field":"event","op":"is","value":"timeout"},{"field":"state","op":"is not","value":"committed"},{"field":"state","op":"is not","value":"rejected"}],"then":"abandoned","why":"an expired session always releases its pin"}],"examples":[{"request":"open patch match","response":"receiving"},{"request":"receiving patch match","response":"receiving"},{"request":"receiving gap match","response":"receiving"},{"request":"receiving complete match","response":"committed"},{"request":"receiving complete mismatch","response":"rejected"},{"request":"receiving timeout match","response":"abandoned"},{"request":"open complete match","response":"committed"},{"request":"committed cancel match","response":"committed"}]},"stakeholders":[{"name":"Cloud engineer","text":"Moves images, VM disks and datasets between clouds and sites, and needs every upload to end committed, rejected or abandoned, never half-stored.","concerns":["No half-stored blobs"]},{"name":"Registry operator","text":"Runs the registry day to day and needs every abandoned or rejected upload to release its pin so storage is reclaimed.","concerns":["No half-stored blobs"]}],"concerns":[{"name":"No half-stored blobs","text":"An upload either commits exactly the bytes its label names, or discards its partial data and releases its pin.","model":"quality"}],"components":[{"name":"kappa-registry","kind":"externalSystem","text":"The single-binary registry for OCI, Git, S3, Nix and AT Protocol over one content-addressed store."},{"name":"Prism page","kind":"staticSite","text":"The published GitHub Pages site: it checks the holo seal, sends the request to the verified guest in the browser and shows the answer in the reader's view."}],"threats":[{"name":"Mismatched blob committed","text":"A client closes an upload whose bytes do not hash to the label, and corrupt content is stored under a trusted name.","stride":"tampering","asset":"request","likelihood":"medium","impact":"critical","control":{"name":"Label match before commit","text":"A mismatched upload is never committed, proved for every request.","evidence":[{"kind":"proof","reference":"INV-001"}]}},{"name":"Leaked upload pins","text":"Sessions that never complete keep their pins and fill the store.","stride":"denialOfService","asset":"request","likelihood":"high","impact":"major","control":{"name":"Timeout abandons","text":"An expired session is always abandoned and its pin released, proved for every request.","evidence":[{"kind":"proof","reference":"INV-002"}]}}],"quality":[{"characteristic":"Reliability","subcharacteristic":"Recoverability","requirement":"Resume after a gap","text":"A PATCH at the wrong offset never ends a session.","measure":"Sessions ended by a gap","measureText":"Requests with event gap from open or receiving answered committed, rejected or abandoned.","threshold":0}],"journeys":[{"stakeholder":"Cloud engineer","steps":["REQ-008","REQ-007","REQ-009"]},{"stakeholder":"Registry operator","steps":["REQ-004","INV-002","REQ-010"]}]},"gc-eviction":{"schema":"prism/prompt/1","goal":"Decide whether garbage collection may evict a blob from a kappa-distribution registry, so storage is reclaimed without losing anything a tag, pin, finalizer or upload still needs.","pattern":"decisionTable","repository":"UOR-Foundation/kappa-distribution","app":{"name":"gc-eviction","title":"GC eviction","purpose":"Decide, as a DMN decision table with hit policy FIRST, whether a sweep retains or evicts a ,"title":"Rollout gate","purpose":"Decide, as a DMN decision table with hit policy FIRST, whether a kappa-registry platform may roll out, from its conformance verdict, its signing key backup, its data backup, whether its environment is pinned and whether its images were admitted.","limits":["It decides from the verdicts the other apps give; it runs none of them.","Budget and staffing are outside it."],"fields":[{"name":"conformance","kind":"choice","values":["ideal","conformant","nonconformant","untested"],"means":"the conformance verdict of the registry"},{"name":"key","kind":"choice","values":["backed-up","missing"],"means":"whether the node's Ed25519 signing key in keys/ is backed up"},{"name":"backup","kind":"choice","values":["complete","partial","none"],"means":"whether blobs/ and state.redb are backed up"},{"name":"env","kind":"choice","values":["pinned","drifting"],"means":"whether the toolchain is pinned by a Nix flake lock"},{"name":"images","kind":"choice","values":["admitted","refused"],"means":"whether every image the rollout needs was admitted"}],"outcomes":["go","hold","no-go"],"meanings":{"go":"ready to roll out","hold":"nothing is broken, but something is unproven or unprotected; fix it and ask again","no-go":"something is broken that a rollout would make worse"},"rules":[{"when":[{"field":"key","op":"is","value":"missing"}],"then":"no-go","why":"kappa-registry README: losing the signing key loses every capability edge, delegation chain and epoch signature"},{"when":[{"field":"conformance","op":"is","value":"nonconformant"}],"then":"no-go","why":"a MUST failure means clients cannot rely on the protocol"},{"when":[{"field":"images","op":"is","value":"refused"}],"then":"no-go","why":"a workload whose image was refused cannot run"},{"when":[{"field":"conformance","op":"is","value":"untested"}],"then":"hold","why":"an untested registry is unproven, not broken"},{"when":[{"field":"backup","op":"is not","value":"complete"}],"then":"hold","why":"kappa-registry README: back up blobs/, state.redb and keys/"},{"when":[{"field":"env","op":"is","value":"drifting"}],"then":"hold","why":"kappa-distribution CLAUDE.md: the toolchain is hermetic via Nix, so a drifting one cannot reproduce the build"}],"otherwise":"go","otherwiseWhy":"conformant, keyed, backed up, pinned and admitted","properties":[{"kind":"never","when":[{"field":"key","op":"is","value":"missing"}],"then":"go","why":"never roll out a node whose identity could be lost"},{"kind":"never","when":[{"field":"conformance","op":"is","value":"untested"}],"then":"go","why":"never roll out an untested registry"},{"kind":"never","when":[{"field":"backup","op":"is not","value":"complete"}],"then":"go","why":"never roll out without a complete backup"},{"kind":"always","when":[{"field":"conformance","op":"is","value":"nonconformant"}],"then":"no-go","why":"a nonconformant registry is always no-go"}],"examples":[{"request":"ideal backed-up complete pinned admitted","response":"go"},{"request":"conformant backed-up complete pinned admitted","response":"go"},{"request":"ideal missing complete pinned admitted","response":"no-go"},{"request":"nonconformant backed-up complete pinned admitted","response":"no-go"},{"request":"ideal backed-up complete pinned refused","response":"no-go"},{"request":"untested backed-up complete pinned admitted","response":"hold"},{"request":"ideal backed-up partial pinned admitted","response":"hold"},{"request":"ideal backed-up complete drifting admitted","response":"hold"}]},"stakeholders":[{"name":"Engineering leader","text":"Decides when the platform ships and needs one word, go, hold or no-go, with the reason, not a test report.","concerns":["One word with its reason"]},{"name":"Business owner","text":"Pays for storage and answers for data loss, and needs both kept down without reading the protocol.","concerns":["One word with its reason"]}],"concerns":[{"name":"One word with its reason","text":"The rollout answer is go, hold or no-go, and every no-go and hold names the rule that gave it.","model":"quality"}],"components":[{"name":"Prism page","kind":"staticSite","text":"The published GitHub Pages site: it checks the holo seal, sends the request to the verified guest in the browser and shows the answer in the reader's view."},{"name":"Pipeline adapter","kind":"cliAdapter","text":"The CI step that sends the same request line to the same holo and fails the pipeline on the answer, so a pipeline and a person get one answer."}],"threats":[{"name":"Go without recovery","text":"A rollout is approved while the signing key or the backup is missing, so a failure cannot be recovered.","stride":"elevationOfPrivilege","asset":"answer","likelihood":"medium","impact":"critical","control":{"name":"Proved gate","text":"Go is never the answer with a missing key, an untested registry or an incomplete backup, proved for every request.","evidence":[{"kind":"proof","reference":"INV-001"},{"kind":"proof","reference":"INV-002"},{"kind":"proof","reference":"INV-003"}]}}],"quality":[{"characteristic":"Safety","subcharacteristic":"Risk identification","requirement":"No unsafe go","text":"No rollout with a missing key, an untested registry or an incomplete backup is answered go.","measure":"Unsafe go answers","measureText":"Such requests answered go.","threshold":0},{"characteristic":"Interaction capability","subcharacteristic":"Appropriateness recognizability","requirement":"One word for leadership","text":"Every request is answered go, hold or no-go.","measure":"Answers outside go, hold and no-go","measureText":"Well-formed requests answered anything else.","threshold":0}],"journeys":[{"stakeholder":"Engineering leader","steps":["REQ-001","REQ-004","INV-004"]},{"stakeholder":"Business owner","steps":["INV-001","INV-003"]}]},"stakeholder-view":{"schema":"prism/prompt/1","goal":"Route each stakeholder's question to the one proved decision that answers it, in that stakeholder's view, so the product shows every reader only what they need.","pattern":"decisionTable","repository":"afflom/prism-kat","app":{"name":"stakeholder-view","title":"Stakeholder view","purpose":"Decide, as a DMN decision table with hit policy FIRST, which decision app answers a stakeholder's question, from the stakeholder's viewpoint and the kind of question they ask, or that the question is outside their view.","limits":["It routes; the app it names gives the answer.","The words each view uses are the product record's, prism/product.json."],"fields":[{"name":"viewpoint","kind":"choice","values":["platform","cloud","operator","security","leader","business"],"means":"the ISO/IEC/IEEE 42010 viewpoint: platform, cloud, operations, security, engineering leadership or business"},{"name":"need","kind":"choice","values":["registry","address","upload","storage","image","rollout"],"means":"the question: does the registry conform, is this address admitted, where is my upload, can this storage go, may this image run, can we roll out"}],"outcomes":["conformance-verdict","kappa-label-check","upload-session","gc-eviction","vm-image-admission","rollout-gate","outside-view"],"meanings":{"conformance-verdict":"ask the conformance-verdict app","kappa-label-check":"ask the kappa-label-check app","upload-session":"ask the upload-session app","gc-eviction":"ask the gc-eviction app","vm-image-admission":"ask the vm-image-admission app","rollout-gate":"ask the rollout-gate app","outside-view":"this question belongs to another stakeholder's view"},"rules":[{"when":[{"field":"viewpoint","op":"is","value":"platform"},{"field":"need","op":"is","value":"registry"}],"then":"conformance-verdict","why":"prism/product.json viewpoint platform (Platform engineering): the registry question is answered by conformance-verdict"},{"when":[{"field":"viewpoint","op":"is","value":"platform"},{"field":"need","op":"is","value":"address"}],"then":"kappa-label-check","why":"prism/product.json viewpoint platform (Platform engineering): the address question is answered by kappa-label-check"},{"when":[{"field":"viewpoint","op":"is","value":"cloud"},{"field":"need","op":"is","value":"upload"}],"then":"upload-session","why":"prism/product.json viewpoint cloud (Cloud engineering): the upload question is answered by upload-session"},{"when":[{"field":"viewpoint","op":"is","value":"cloud"},{"field":"need","op":"is","value":"image"}],"then":"vm-image-admission","why":"prism/product.json viewpoint cloud (Cloud engineering): the image question is answered by vm-image-admission"},{"when":[{"field":"viewpoint","op":"is","value":"operator"},{"field":"need","op":"is","value":"storage"}],"then":"gc-eviction","why":"prism/product.json viewpoint operator (Operations and SRE): the storage question is answered by gc-eviction"},{"when":[{"field":"viewpoint","op":"is","value":"operator"},{"field":"need","op":"is","value":"upload"}],"then":"upload-session","why":"prism/product.json viewpoint operator (Operations and SRE): the upload question is answered by upload-session"},{"when":[{"field":"viewpoint","op":"is","value":"operator"},{"field":"need","op":"is","value":"registry"}],"then":"conformance-verdict","why":"prism/product.json viewpoint operator (Operations and SRE): the registry question is answered by conformance-verdict"},{"when":[{"field":"viewpoint","op":"is","value":"security"},{"field":"need","op":"is","value":"image"}],"then":"vm-image-admission","why":"prism/product.json viewpoint security (Security and supply chain): the image question is answered by vm-image-admission"},{"when":[{"field":"viewpoint","op":"is","value":"security"},{"field":"need","op":"is","value":"address"}],"then":"kappa-label-check","why":"prism/product.json viewpoint security (Security and supply chain): the address question is answered by kappa-label-check"},{"when":[{"field":"viewpoint","op":"is","value":"leader"},{"field":"need","op":"is","value":"rollout"}],"then":"rollout-gate","why":"prism/product.json viewpoint leader (Engineering leadership): the rollout question is answered by rollout-gate"},{"when":[{"field":"viewpoint","op":"is","value":"business"},{"field":"need","op":"is","value":"storage"}],"then":"gc-eviction","why":"prism/product.json viewpoint business (Business and risk): the storage question is answered by gc-eviction"},{"when":[{"field":"viewpoint","op":"is","value":"business"},{"field":"need","op":"is","value":"rollout"}],"then":"rollout-gate","why":"prism/product.json viewpoint business (Business and risk): the rollout question is answered by rollout-gate"}],"otherwise":"outside-view","otherwiseWhy":"prism/product.json: each view names only the apps its stakeholder needs","properties":[{"kind":"never","when":[{"field":"viewpoint","op":"is","value":"leader"}],"then":"kappa-label-check","why":"an engineering leader is never handed a protocol-level address check"},{"kind":"never","when":[{"field":"viewpoint","op":"is","value":"business"}],"then":"kappa-label-check","why":"a business owner is never handed a protocol-level address check"},{"kind":"always","when":[{"field":"need","op":"is","value":"rollout"},{"field":"viewpoint","op":"is","value":"leader"}],"then":"rollout-gate","why":"the leader's rollout question always reaches the rollout gate"},{"kind":"always","when":[{"field":"need","op":"is","value":"image"},{"field":"viewpoint","op":"is","value":"security"}],"then":"vm-image-admission","why":"security's image question always reaches image admission"}],"examples":[{"request":"platform registry","response":"conformance-verdict"},{"request":"platform address","response":"kappa-label-check"},{"request":"cloud upload","response":"upload-session"},{"request":"operator storage","response":"gc-eviction"},{"request":"security image","response":"vm-image-admission"},{"request":"leader rollout","response":"rollout-gate"},{"request":"leader address","response":"outside-view"},{"request":"business storage","response":"gc-eviction"}]},"stakeholders":[{"name":"Platform engineer","text":"Builds the internal platform and its golden paths, and needs one honest verdict that a registry speaks kappa-distribution before teams depend on it.","concerns":["Correct answers","Every reader is routed to the decision that answers them"]},{"name":"Cloud engineer","text":"Moves images, VM disks and datasets between clouds and sites, including air-gapped ones, and needs the same image to be admitted the same way everywhere.","concerns":["Correct answers","Every reader is routed to the decision that answers them"]},{"name":"Registry operator","text":"Runs the registry day to day and needs storage reclaimed without ever losing content a tag, pin, finalizer or upload still needs.","concerns":["Correct answers","Every reader is routed to the decision that answers them"]},{"name":"Security engineer","text":"Owns supply-chain integrity and needs every image the platform runs to be signed, matching and from an allowed source.","concerns":["Correct answers","Every reader is routed to the decision that answers them"]},{"name":"Engineering leader","text":"Decides when the platform ships and needs one word, go, hold or no-go, with the reason, not a test report.","concerns":["Correct answers","Every reader is routed to the decision that answers them"]},{"name":"Business owner","text":"Pays for storage and answers for data loss, and needs both kept down without reading the protocol.","concerns":["Correct answers","Every reader is routed to the decision that answers them"]}],"concerns":[{"name":"Every reader is routed to the decision that answers them","text":"Each viewpoint and need lands on one proved decision, or is told it is outside that view.","model":"component"}],"components":[{"name":"Prism page","kind":"staticSite","text":"The published GitHub Pages site: it checks the holo seal, sends the request to the verified guest in the browser and shows the answer in the reader's view."}],"threats":[{"name":"Leader handed a protocol check","text":"A leader asking about addresses is routed to the raw kappa-label check and acts on a detail outside their view.","stride":"informationDisclosure","asset":"answer","element":"Prism page","likelihood":"medium","impact":"minor","control":{"name":"Proved routing","text":"Leader and business viewpoints are never routed to kappa-label-check, proved for every request.","evidence":[{"kind":"proof","reference":"INV-001"},{"kind":"proof","reference":"INV-002"}]}}],"quality":[{"characteristic":"Interaction capability","subcharacteristic":"Operability","requirement":"Leaders reach the rollout gate","text":"A leader asking about a rollout always reaches the rollout gate.","measure":"Misrouted leader rollout questions","measureText":"Requests leader rollout answered other than rollout-gate.","threshold":0}],"journeys":[{"stakeholder":"Engineering leader","steps":["INV-003","INV-001"]},{"stakeholder":"Security engineer","steps":["INV-004"]},{"stakeholder":"Platform engineer","steps":["REQ-001","REQ-002"]}]},"frontend-feature":{"schema":"prism/prompt/1","goal":"Decide which front end feature each stakeholder sees for each part of an answer, so every view shows what that reader needs and nothing that buries it.","pattern":"decisionTable","repository":"afflom/prism-kat","app":{"name":"frontend-feature","title":"Front end feature","purpose":"Decide, as a DMN decision table with hit policy FIRST, which front end feature renders one surface of an answer (the answer, its reason, its rules, its proof, the journey, the words or the seal) for a stakeholder viewpoint, or that the surface is not shown in that view.","limits":["It decides what is shown; the backend capability that serves each feature is decided by backend-capability.","The words inside a feature come from the product record, prism/product.json."],"fields":[{"name":"viewpoint","kind":"choice","values":["platform","cloud","operator","security","leader","business"],"means":"the stakeholder viewpoint the reader chose: platform, cloud, operator, security, leader or business"},{"name":"surface","kind":"choice","values":["answer","reason","rules","proof","journey","words","seal"],"means":"the part of an answer to render: the answer itself, its plain reason, the rules that fired, the proof, the journey of checked examples, the UOR words, or the holo seal"}],"outcomes":["verdict-card","plain-reason","rule-trace","proof-panel","journey-steps","lexicon-panel","seal-badge","not-shown"],"meanings":{"verdict-card":"the one-word answer, coloured by whether it is positive, negative or a refusal","plain-reason":"one sentence in the reader's words: why this answer, and which promise it keeps","rule-trace":"the rule that fired, its conditions and the spec line it cites","proof-panel":"the property theorems, where they live, and the CI run that checked them","journey-steps":"the reader's journey as checked examples they can replay one by one","lexicon-panel":"the UOR term, its platform term and its plain words, side by side","seal-badge":"the holo fingerprint and the replayed acceptance vectors, shown before any answer","not-shown":"this surface is left out of this view, so it does not bury the answer"},"rules":[{"when":[{"field":"surface","op":"is","value":"seal"}],"then":"seal-badge","why":"every reader is shown the seal before trusting an answer: verify before you trust"},{"when":[{"field":"surface","op":"is","value":"answer"}],"then":"verdict-card","why":"every view leads with the answer"},{"when":[{"field":"surface","op":"is","value":"reason"}],"then":"plain-reason","why":"every view gives the reason in its own words"},{"when":[{"field":"surface","op":"is","value":"words"}],"then":"lexicon-panel","why":"every view can translate a UOR word into its platform word"},{"when":[{"field":"surface","op":"is","value":"journey"}],"then":"journey-steps","why":"every view has a journey of checked examples"},{"when":[{"field":"surface","op":"is","value":"rules"},{"field":"viewpoint","op":"is","value":"leader"}],"then":"not-shown","why":"a leader decides go, hold or no-go and is not handed protocol rules"},{"when":[{"field":"surface","op":"is","value":"rules"},{"field":"viewpoint","op":"is","value":"business"}],"then":"not-shown","why":"a business owner weighs cost and loss, not protocol rules"},{"when":[{"field":"surface","op":"is","value":"proof"},{"field":"viewpoint","op":"is","value":"leader"}],"then":"plain-reason","why":"a leader gets the promise in plain words, with the proof one link away"},{"when":[{"field":"surface","op":"is","value":"proof"},{"field":"viewpoint","op":"is","value":"business"}],"then":"plain-reason","why":"a business owner gets the promise in plain words"},{"when":[{"field":"surface","op":"is","value":"rules"}],"then":"rule-trace","why":"an engineer sees the rule that fired and the spec line it cites"},{"when":[{"field":"surface","op":"is","value":"proof"}],"then":"proof-panel","why":"an engineer sees the theorems and the run that checked them"}],"otherwise":"not-shown","otherwiseWhy":"a surface no rule places is left out","properties":[{"kind":"never","when":[{"field":"viewpoint","op":"is","value":"leader"}],"then":"rule-trace","why":"a leader is never handed protocol rules"},{"kind":"always","when":[{"field":"surface","op":"is","value":"seal"}],"then":"seal-badge","why":"every reader in every view sees the seal"},{"kind":"always","when":[{"field":"surface","op":"is","value":"answer"}],"then":"verdict-card","why":"every view leads with the answer"}],"examples":[{"request":"platform rules","response":"rule-trace"},{"request":"security proof","response":"proof-panel"},{"request":"leader rules","response":"not-shown"},{"request":"leader proof","response":"plain-reason"},{"request":"business answer","response":"verdict-card"},{"request":"cloud seal","response":"seal-badge"},{"request":"operator journey","response":"journey-steps"},{"request":"business words","response":"lexicon-panel"},{"request":"business rules","response":"not-shown"}]},"stakeholders":[{"name":"Engineering leader","text":"Decides whether a platform change ships and needs the answer and its reason, never a wall of protocol detail.","concerns":["Each view shows only what its reader needs"]},{"name":"Platform engineer","text":"Builds the platform and wants the rule that fired and the theorem behind it one click from the answer.","concerns":["Correct answers"]},{"name":"Business owner","text":"Pays for the platform and weighs what could be lost, in plain words.","concerns":["Each view shows only what its reader needs"]}],"concerns":[{"name":"Each view shows only what its reader needs","text":"The answer leads every view, the seal is always shown, and protocol detail reaches only the readers who act on it.","model":"quality"}],"components":[{"name":"Prism page","kind":"staticSite","text":"The published GitHub Pages site: it checks the holo seal, sends the request to the verified guest in the browser and shows the answer in the reader's view."}],"quality":[{"characteristic":"Interaction capability","subcharacteristic":"Appropriateness recognizability","requirement":"Answer first in every view","text":"Every view renders the answer as a verdict card.","measure":"Views without a verdict card","measureText":"Viewpoints for which the answer surface is not shown as a verdict card.","threshold":0},{"characteristic":"Interaction capability","subcharacteristic":"Self-descriptiveness","requirement":"Seal in every view","text":"Every view shows the holo seal.","measure":"Views without the seal","measureText":"Viewpoints for which the seal surface is not a seal badge.","threshold":0}],"threats":[{"name":"Protocol detail buries the answer","text":"A leader handed rule traces misreads a hold as a no-go and stops a rollout that was safe.","stride":"informationDisclosure","asset":"answer","element":"Prism page","likelihood":"medium","impact":"major","control":{"name":"Proved views","text":"The leader view never renders a rule trace, proved for every request; the business view leaves rules out by its own rule, checked by its example.","evidence":[{"kind":"proof","reference":"INV-001"}]}}],"journeys":[{"stakeholder":"Engineering leader","steps":["REQ-001","REQ-002","REQ-003","REQ-006","REQ-008"]},{"stakeholder":"Platform engineer","steps":["REQ-001","REQ-002","REQ-010","REQ-011"]},{"stakeholder":"Business owner","steps":["REQ-002","REQ-003","REQ-004","REQ-009"]}]},"backend-capability":{"schema":"prism/prompt/1","goal":"Decide which backend capability serves each front end feature at a connected or an air-gapped site, so every feature the views need is served, and none reaches the network where there is none.","pattern":"decisionTable","repository":"afflom/prism-kat","app":{"name":"backend-capability","title":"Backend capability","purpose":"Decide, as a DMN decision table with hit policy FIRST, which backend capability serves a front end feature at a site that is online or air-gapped: the verified guest, the static model record, acceptance-vector replay, the fingerprint check, the proof bundled with the site, or a link to the CI attestation.","limits":["Every capability runs in the reader's browser or is a static file of the site; there is no application server.","Which feature a view shows is decided by frontend-feature."],"fields":[{"name":"feature","kind":"choice","values":["verdict-card","plain-reason","rule-trace","proof-panel","journey-steps","lexicon-panel","seal-badge"],"means":"the front end feature to serve, as frontend-feature names it"},{"name":"site","kind":"choice","values":["online","airgapped"],"means":"whether the site serving the page can reach the internet"}],"outcomes":["guest-dispatch","model-record","vector-replay","fingerprint-check","bundled-proof","attestation-link"],"meanings":{"guest-dispatch":"the verified WebAssembly guest computes the answer in the browser, through the router","model-record":"the static model record the builder writes, site/app.json and the facet modules","vector-replay":"the guest replays the acceptance vectors, so each journey step is a checked answer","fingerprint-check":"the browser recomputes the holo fingerprint and compares it with the published one","bundled-proof":"the LexLean proof sources shipped inside the site, readable with no network","attestation-link":"a link to the CI run that checked the proofs, on GitHub"},"rules":[{"when":[{"field":"feature","op":"is","value":"seal-badge"}],"then":"fingerprint-check","why":"the seal is the fingerprint, recomputed in the browser"},{"when":[{"field":"feature","op":"is","value":"verdict-card"}],"then":"guest-dispatch","why":"the answer is computed by the verified guest, never by a server"},{"when":[{"field":"feature","op":"is","value":"journey-steps"}],"then":"vector-replay","why":"journey steps are the acceptance vectors, replayed"},{"when":[{"field":"feature","op":"is","value":"plain-reason"}],"then":"model-record","why":"the reason is read from the model the guest is built from"},{"when":[{"field":"feature","op":"is","value":"lexicon-panel"}],"then":"model-record","why":"the words are read from the product record"},{"when":[{"field":"feature","op":"is","value":"rule-trace"}],"then":"model-record","why":"the rules and their citations are read from the model"},{"when":[{"field":"feature","op":"is","value":"proof-panel"},{"field":"site","op":"is","value":"airgapped"}],"then":"bundled-proof","why":"with no network the proof is read from the sources shipped with the site"},{"when":[{"field":"feature","op":"is","value":"proof-panel"}],"then":"attestation-link","why":"online, the proof panel links the CI run that checked it"}],"otherwise":"model-record","otherwiseWhy":"anything else is read from the static model record","properties":[{"kind":"never","when":[{"field":"site","op":"is","value":"airgapped"}],"then":"attestation-link","why":"nothing at an air-gapped site ever reaches for the network"},{"kind":"always","when":[{"field":"feature","op":"is","value":"seal-badge"}],"then":"fingerprint-check","why":"the seal is always recomputed, never trusted as text"},{"kind":"always","when":[{"field":"feature","op":"is","value":"verdict-card"}],"then":"guest-dispatch","why":"every answer comes from the verified guest"}],"examples":[{"request":"verdict-card airgapped","response":"guest-dispatch"},{"request":"seal-badge online","response":"fingerprint-check"},{"request":"proof-panel airgapped","response":"bundled-proof"},{"request":"proof-panel online","response":"attestation-link"},{"request":"journey-steps online","response":"vector-replay"},{"request":"rule-trace airgapped","response":"model-record"},{"request":"lexicon-panel online","response":"model-record"}]},"stakeholders":[{"name":"Cloud engineer","text":"Runs the same page at a disconnected site and needs every feature to work there with no internet.","concerns":["Works with no network"]},{"name":"Security engineer","text":"Needs every answer computed by the sealed guest, never by a server that could be changed quietly.","concerns":["Correct answers"]}],"concerns":[{"name":"Works with no network","text":"Every front end feature is served at an air-gapped site from the browser and the static site alone.","model":"quality"}],"components":[{"name":"Prism page","kind":"staticSite","text":"The published GitHub Pages site: it checks the holo seal, sends the request to the verified guest in the browser and shows the answer in the reader's view."},{"name":"Site mirror","kind":"externalSystem","text":"The air-gapped site's own registry and static host, which serves the page, the holo and the bundled proofs."}],"quality":[{"characteristic":"Flexibility","subcharacteristic":"Installability","requirement":"Air-gapped install","text":"Every feature is served at an air-gapped site with no network call.","measure":"Network calls at an air-gapped site","measureText":"Features answered attestation-link when the site is airgapped.","threshold":0},{"characteristic":"Security","subcharacteristic":"Integrity","requirement":"Answers come from the guest","text":"Every answer is computed by the verifie
